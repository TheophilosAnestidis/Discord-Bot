<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultX • Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080d;color:#f5f7fb;font:14px Inter,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:auto;padding:38px}.box{background:#0e1119;border:1px solid #252b39;border-radius:18px;box-shadow:0 25px 80px #0008;padding:24px}
.login{max-width:420px;margin:14vh auto}.brand{font-weight:900;font-size:18px;margin-bottom:18px}.muted{color:#8b93a5;font-size:12px}input,select,button{font:inherit}input,select{width:100%;padding:12px;background:#080b11;border:1px solid #252b39;color:#fff;border-radius:10px;margin:8px 0 12px}button{border:0;border-radius:10px;padding:11px 15px;background:#8b5cf6;color:white;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.08)}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{padding:18px}.metric b{display:block;font-size:26px;margin-top:7px}.table{overflow:auto}.row{display:grid;grid-template-columns:150px 100px 1fr 130px 160px;gap:12px;align-items:center;padding:13px;border-top:1px solid #1e2431;font-size:12px}.head{color:#778197;font-size:10px;text-transform:uppercase}.pill{padding:5px 8px;border-radius:999px;background:#171c27;width:max-content}.actions{display:flex;gap:7px}.danger{background:#3a1820;color:#fecdd3}.msg{margin-top:10px;color:#fbbf24}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.wrap{padding:18px}}
@keyframes vxIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}@keyframes vxGlow{0%,100%{box-shadow:0 0 0 rgba(139,92,246,0)}50%{box-shadow:0 0 30px rgba(139,92,246,.12)}}.box{animation:vxIn .45s ease both}.metric{animation:vxGlow 3s ease-in-out infinite}.row{transition:background .2s,transform .2s}.row:not(.head):hover{background:#131824;transform:translateX(2px)}button{transition:transform .18s,filter .18s}button:hover{transform:translateY(-1px)}.top{gap:16px}.statusdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:7px;box-shadow:0 0 12px #22c55e}.subgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 18px}.mini{padding:14px;background:#0b0e15;border:1px solid #202634;border-radius:13px}.mini b{display:block;font-size:20px;margin-top:5px}@media(max-width:800px){.subgrid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login" class="login box"><div class="brand">VaultX 〢 Admin</div><div class="muted">Password-only administrator access. Session duration: 10 minutes.</div><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button id="loginBtn">Sign in</button><div id="loginMsg" class="msg"></div></div>
<div id="panel" class="wrap hidden"><div class="top"><div><div class="brand">VaultX 〢 Admin Panel</div><div class="muted">Orders, licensing and operational control.</div></div><button id="logout" class="danger">Logout</button></div>
<div class="grid"><div class="box metric"><span class="muted"><span class="statusdot"></span>Orders</span><b id="orders">0</b></div><div class="box metric"><span class="muted">Pending</span><b id="pending">0</b></div><div class="box metric"><span class="muted">Paid</span><b id="paid">0</b></div><div class="box metric"><span class="muted">Revenue</span><b id="revenue">€0.00</b></div></div>
<div class="box"><div class="top"><div><b>Purchase orders</b><div class="muted">Mark manual payments as paid or fulfilled.</div></div><button id="refresh">Refresh</button></div><div class="table"><div class="row head"><span>Order</span><span>Plan</span><span>Guild / User</span><span>Amount</span><span>Status</span></div><div id="list"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function check(){try{await api('/api/admin/me');$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}catch{}}
async function load(){const [r,o]=await Promise.all([api('/api/admin/orders'),api('/api/admin/overview')]);const a=r.orders||[];$('orders').textContent=a.length;$('premiumServers').textContent=o.premiumServers;$('servers').textContent=o.servers;$('tickets').textContent=o.tickets;$('fulfilled').textContent=o.stats?.fulfilled||0;$('pending').textContent=a.filter(x=>x.status==='pending').length;$('paid').textContent=a.filter(x=>x.status==='paid'||x.status==='fulfilled').length;$('revenue').textContent='€'+a.filter(x=>x.status==='paid'||x.status==='fulfilled').reduce((n,x)=>n+Number(x.amount||0),0).toFixed(2);$('list').innerHTML=a.map(o=>`<div class="row"><span><b>${esc(o.id)}</b><br><span class="muted">${new Date(o.created_at).toLocaleString()}</span></span><span>${esc(o.plan)}</span><span>${esc(o.guild_id||'—')}<br>${esc(o.user_id||'—')}</span><span>€${Number(o.amount).toFixed(2)}</span><span class="actions"><select data-status="${esc(o.id)}"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='paid'?'selected':''}>paid</option><option ${o.status==='fulfilled'?'selected':''}>fulfilled</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></span></div>`).join('');document.querySelectorAll('[data-status]').forEach(x=>x.onchange=async()=>{try{await api('/api/admin/orders/'+x.dataset.status,{method:'PATCH',body:JSON.stringify({status:x.value})});load()}catch(e){alert(e.message)}})}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';check()}catch(e){$('loginMsg').textContent=e.message}};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('refresh').onclick=load;$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};check();
</script></body></html>
